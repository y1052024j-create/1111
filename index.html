<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💕 اول يوم لينا</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #B20000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, sans-serif;
  }

  .heart-float {
    position: fixed;
    color: rgba(255,255,255,0.15);
    pointer-events: none;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
    10% { opacity: 0.8; }
    75% { opacity: 0.6; }
    100% { transform: translateY(25vh) scale(1) rotate(20deg); opacity: 0; }
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.15); }
    30% { transform: scale(1); }
    45% { transform: scale(1.1); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .container {
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    width: 320px;
  }

  .big-heart {
    font-size: 60px;
    animation: heartbeat 1.5s ease-in-out infinite;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
  }

  .title {
    color: rgba(255,255,255,0.9);
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 1px;
  }

  input {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    text-align: center;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: white;
    font-size: 16px;
    outline: none;
    backdrop-filter: blur(8px);
    transition: all 0.3s;
  }
  input::placeholder { color: rgba(255,255,255,0.5); }
  input:focus { box-shadow: 0 0 0 2px rgba(255,255,255,0.4); }

  .error {
    color: rgba(255,255,255,0.8);
    font-size: 14px;
    animation: fadeIn 0.3s ease-out;
  }

  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: white;
    color: #B20000;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    transition: all 0.3s;
  }
  .btn:hover { transform: scale(1.05); box-shadow: 0 14px 40px rgba(0,0,0,0.4); }
  .btn:active { transform: scale(0.95); }

  .btn-ready {
    display: none;
    animation: fadeIn 0.5s ease-out;
  }

  .hidden { display: none; }
</style>
</head>
<body>

<div class="container">
  <div class="big-heart">❤️</div>
  <h2 class="title">اول يوم لينا 💕</h2>
  <input type="password" id="pass" placeholder="ادخل الباسورد" onkeydown="if(event.key==='Enter')login()">
  <p class="error hidden" id="err">الباسورد غلط 💔</p>
  <button class="btn" id="loginBtn" onclick="login()">دخول 🔐</button>
  <button class="btn btn-ready" id="readyBtn" onclick="window.location.href='الصفحه_التانيه.html'">جاهزه؟ 💃</button>
</div>

<script>
// Floating hearts
for (let i = 0; i < 25; i++) {
  const h = document.createElement('div');
  h.className = 'heart-float';
  h.textContent = '❤';
  h.style.left = Math.random() * 100 + '%';
  h.style.fontSize = (16 + Math.random() * 32) + 'px';
  h.style.animationDelay = Math.random() * 10 + 's';
  h.style.animationDuration = (6 + Math.random() * 6) + 's';
  document.body.appendChild(h);
}

function login() {
  const pass = document.getElementById('pass').value;
  if (pass === '1052024') {
    document.getElementById('loginBtn').style.display = 'none';
    const ready = document.getElementById('readyBtn');
    ready.style.display = 'block';
    document.getElementById('err').classList.add('hidden');
  } else {
    document.getElementById('err').classList.remove('hidden');
    setTimeout(() => document.getElementById('err').classList.add('hidden'), 2000);
  }
}
</script>
</body>
</html>
